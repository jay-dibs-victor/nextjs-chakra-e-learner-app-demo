version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://db:27017/lms_db
      - JWT_SECRET=supersecretkey
      - PORT=5000
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - db

  db:
    image: mongo:latest
    ports:
      - "2717:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
